<!DOCTYPE html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tooltip Demo</title>
  <style>
    .tooltip {
        position: relative;
      color: red;
    }
    
    h1:hover {
      opacity: 0.5;
      transition: opacity 0.5s ease-in-out;
    }
    h1 {
        justify-content: center;
        margin: 20px;
    }
  </style>
</head>
<body>
  <h1 class="tooltip">Tooltip Demo</h1>
</body>
