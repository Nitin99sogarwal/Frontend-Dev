<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
   
</head>
<body>
    <h2>Registration Form</h2>
    <form action="/submit_registration" >
        Email: <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br></br>
        Password:
        <input type="password" id="password" name="password" placeholder="Enter your password" required> <br></br>
        Retype Password:
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Retype your password" required>
        <br></br>
        First Name:
        <input type="text" id="first_name" name="first_name" placeholder="Enter your first name" required>
        <br></br>
        Last Name:
        <input type="text" id="last_name" name="last_name" placeholder="Enter your last name" required>
        <br></br>
        Phone Number:
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
        <br></br>
        Address:
        <input type="text" id="address" name="address" placeholder="Enter your address" required>
        <br></br>
        Country:
        <select id="country" name="country" required>
            <option value="">Select your country</option>
            <option value="usa">United States</option>
            <option value="canada">Canada</option>
            <option value="india">India</option>
        </select>
        <br></br>
        <button type="submit">Register</button>
    </form>
</body>
</html>
